<!DOCTYPE html>
<html>

<head>
    <title>F03 RTI-17</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8" />

    <link id="skinCssLink" rel="stylesheet" href="" />

    <style>
        html, body {
            margin: 0px;
            padding: 0px;
            height: 100%;
            overflow: hidden;
        }
        #mode-bar {
            position: fixed;
            bottom: calc(5vh + 14px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 3px;
        }
        #mode-bar button {
            background: rgba(237,234,228,0.92);
            color: #1a1612;
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 10px;
            font-family: system-ui, sans-serif;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.15s;
        }
        #mode-bar button:hover {
            background: rgba(237,234,228,1);
        }
        #mode-bar button.active {
            background: #c8a055;
            color: #1a1200;
            border-color: rgba(200,160,80,0.4);
            font-weight: 600;
        }
        /* Diğer modlardan ayırmak için vektör butonuna özel çizgi */
        #btn-vector {
            margin-left: 8px;
            border-left: 2px solid rgba(0,0,0,0.2) !important;
        }
    </style>
</head>

<body>
    <div id="mode-bar">
        <button id="btn-light"        onclick="setRTIMode('light')">Light</button>
        <button id="btn-normals"      onclick="setRTIMode('normals')">Normals</button>
        <button id="btn-diffuse"      onclick="setRTIMode('diffuse')" class="active">Diffuse</button>
        <button id="btn-specular"     onclick="setRTIMode('specular')">Specular</button>
        <button id="btn-gray_diffuse" onclick="setRTIMode('gray_diffuse')">Gray Diffuse</button>
        <!-- Yeni eklenen Vector Butonu -->
        <button id="btn-vector"       onclick="toggleVectorLayer()">Vector Off</button>
    </div>
    <div id="demo" class="openlime"></div>
</body>

<script>
    const config = {
        stylesheetUrl: 'skin.css',
        openlimeUrl:   'openlime.min.js',
        skinUrl:       'skin.svg',
        rtiUrl:        'info.json',
        rtiLabel:      'RTI',
        vectorUrl:     'vector.png',
        vectorLabel:   'Vector On/Off'
    };

    document.getElementById('skinCssLink').href = config.stylesheetUrl;

    const openlimeScript = document.createElement('script');
    openlimeScript.src = config.openlimeUrl;
    document.head.appendChild(openlimeScript);

    openlimeScript.onload = function() {

        async function autodetect() {
            let response = await fetch('plane_0.tzi');
            if(response.status == 200) return "tarzoom";
            response = await fetch('plane_0.dzi');
            if(response.status == 200) return "deepzoom";
            response = await fetch('planes.tzi');
            if(response.status == 200) return "itarzoom";
            response = await fetch('plane_0.jpg');
            if(response.status == 200) return "image";
            alert("RTI could not be detected here");
            return "";
        }

        async function autodetectNormals(layout) {
            if(layout == 'tarzoom') {
                let response = await fetch('normals.tzi');
                if(response.status == 200) return true;
            }
            if(layout == 'deepzoom') {
                let response = await fetch('normals.dzi');
                if(response.status == 200) return true;
            }
            if(layout == 'image') {
                let response = await fetch('normals.jpg');
                if(response.status == 200) return true;
            }
            return false;
        }

        async function init() {
            let layout = await autodetect();
            let normals = await autodetectNormals(layout);
            var lime = new OpenLIME.Viewer('#demo', { background:'black' });

            let baseLayer = new OpenLIME.Layer({
                layout: layout,
                type:'rti',
                url: config.rtiUrl,
                normals: normals,
                label: config.rtiLabel
            });
            lime.canvas.addLayer('RTI', baseLayer);
            window._rtiBaseLayer = baseLayer;
            baseLayer.addEvent('ready', () => {
                baseLayer.setMode('diffuse');
            });

            const vectorLayer = new OpenLIME.Layer({
                type: 'image',
                url: config.vectorUrl,
                overlay: true,
                visible: false,
                label: config.vectorLabel
            });
            lime.canvas.addLayer('vector', vectorLayer);
            window._vectorLayer = vectorLayer; // Global erişim için ekledik

            let lensContentLayer = new OpenLIME.Layer({
                layout: layout,
                type:'rti',
                url: config.rtiUrl,
                normals: normals,
                visible: false,
                label: 'Lens'
            });
            lime.canvas.addLayer('RTI Normals', lensContentLayer);

            lensContentLayer.addEvent('ready', () => {
                lensContentLayer.setMode('normals');
            });

            const lensDashboard = new OpenLIME.LensDashboardNavigatorRadial(lime, {
                borderColor: [0.078, 0.078, 0.078, 1],
                borderWidth: 15
            });

            const lensLayer = new OpenLIME.Layer({
                type: 'lens',
                layers: [lensContentLayer],
                camera: lime.camera,
                radius: 200,
                borderWidth: 12,
                borderColor: [0.078, 0.078, 0.078, 1],
                borderEnable: true,
                dashboard: lensDashboard,
                visible: false,
                label: 'Lens On/Off'
            });
            lime.canvas.addLayer('lens', lensLayer);

            const controllerLens = new OpenLIME.ControllerFocusContext({
                lensLayer: lensLayer,
                camera: lime.camera,
                canvas: lime.canvas,
                priority: -200
            });
            lensLayer.controllers.push(controllerLens);
            lime.pointerManager.onEvent(controllerLens);

            OpenLIME.Skin.setUrl(config.skinUrl);
            let ui = new OpenLIME.UIBasic(lime, { skin: config.skinUrl, showLightDirections: true });

            ui.actions.zoomin.display = true;
            ui.actions.zoomout.display = true;
            ui.actions.ruler.display = true;
            ui.actions.ruler.key = 'c';
            ui.actions.rotate.display = true;
            ui.actions.snapshot.display = true;
            ui.actions.snapshot.key = 's';
            ui.actions.light.active = true;
            ui.actions.layers.display = true;
            ui.actions.layers.key = 'z';
            lime.camera.maxFixedZoom = 4;
            window.lime = lime;

            ui.actions.lenstoggle = {
                title: 'Open/Close Lens (Magnifier)',
                key: 'm',
                display: false,
                task: (event) => {
                    lensLayer.setVisible(!lensLayer.visible);
                }
            };

            ui.actions.vectortoggle = {
                title: 'Vector On/Off',
                key: 'v',
                display: false,
                task: (event) => {
                    // Klavyeden V tuşuna basıldığında alt bardaki butonu da güncelle
                    toggleVectorLayer();
                }
            };

            ui.actions.help.display = true;
            ui.actions.help.html = `
                <h2><strong>Rupe Magna Viewer User Guide</strong></h2>

                <h4><strong>💡 Light Control</strong></h4>
                <ul>
                    <li>Click the light icon or press the 'L' key to adjust the light direction.</li>
                    <li>To reposition the light: Move the mouse to change the light direction and use the reference lines to visualise its orientation.</li>
                </ul>

                <h4><strong>🎨 Image Rendering Modes</strong></h4>
                <p>Different viewing modes can be selected from the Layers menu:</p>
                <ul>
                    <li>Light: Standard RTI view</li>
                    <li>Normals: Normal map</li>
                    <li>Diffuse: Diffuse reflection</li>
                    <li>Specular: Specular reflection</li>
                </ul>

                <h4><strong>🔍 Interactive Lens (Magnifier)</strong></h4>
                <p>Toggle the lens on or off: Press the 'M' key (Magnifier).</p>
                <p>The lens appears as a circular area displaying the Normal Map selected in the 'Lens Layer', while the RTI view is shown outside it.</p>
                <ul>
                    <li>Move the lens: Click inside the lens and drag to reposition it.</li>
                    <li>Adjust the lens size: When the cursor is inside the lens, use the mouse wheel to change its size.</li>
                </ul>

                <h4><strong>📏 Measurement (Ruler)</strong></h4>
                <p>Press the 'C' key to enable the ruler and measure distances within the image.</p>
                <p>When the ruler is active, you can measure by clicking two different points on the RTI image using the crosshair (+) cursor.</p>

                <h4><strong>⌨️ Keyboard Shortcuts</strong></h4>
                <ul>
                    <li>M: Toggle Magnifier</li>
                    <li>C: Toggle Ruler</li>
                    <li>V: Toggle Vector Layer</li>
                    <li>A: Rotate</li>
                    <li>L: Light Control</li>
                    <li>Home: Return to Main View</li>
                    <li>+ / - : Zoom In / Out</li>
                </ul>
            `;
        }

        init();

        function setupLightHighlight() {
            const demo = document.getElementById('demo');
            const btn = demo && demo.querySelector('.openlime-button.openlime-light');
            if (!btn) { setTimeout(setupLightHighlight, 200); return; }
            const paths = btn.querySelectorAll('path[style]');
            new MutationObserver(() => {
                const active = demo.classList.contains('openlime-light-active');
                paths.forEach(p => {
                    if (active) {
                        p.style.setProperty('fill', '#ffcc00', 'important');
                        p.style.setProperty('stroke', '#ffcc00', 'important');
                    } else {
                        p.style.removeProperty('fill');
                        p.style.removeProperty('stroke');
                    }
                });
            }).observe(demo, { attributes: true, attributeFilter: ['class'] });
        }
        setupLightHighlight();
    };

    function setRTIMode(mode) {
        if (window._rtiBaseLayer) {
            window._rtiBaseLayer.setMode(mode);
        }
        document.querySelectorAll('#mode-bar button:not(#btn-vector)').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + mode);
        if (btn) btn.classList.add('active');
    }

    function toggleVectorLayer() {
        if (window._vectorLayer) {
            const isVisible = window._vectorLayer.visible;
            window._vectorLayer.setVisible(!isVisible);
            
            const btn = document.getElementById('btn-vector');
            if (btn) {
                if (!isVisible) {
                    btn.classList.add('active');
                    btn.textContent = 'Vector On';
                } else {
                    btn.classList.remove('active');
                    btn.textContent = 'Vector Off';
                }
            }
        }
    }
</script>

</html>
